# Copy-paste-detection exclusion — narrow + time-bound (menu-bundles redesign slice 4b).
#
# ProductDtoMapper is the single WRITE-side Product->ProductDto mapper introduced in #156 (it
# dedups the three near-identical command copies). Its per-DTO construction blocks structurally
# overlap the READ-side query projections (e.g. GetProductByIdQuery), which materialize then build
# a ProductDto with a RICHER / different field set (product Images, GlobalIngredient translations)
# and therefore cannot be swapped onto this mapper without regressing the read path. Consolidating
# the read + write mappers is the separate projection-alignment slice (4b: GetMenuBundle*Query).
# Remove this exclusion when that slice lands.
sonar.cpd.exclusions=**/ProductDtoMapper.cs
