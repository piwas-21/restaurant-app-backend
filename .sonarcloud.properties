# Copy-paste-detection exclusions — narrow, for the two DTO mappers only.
#
# ProductDtoMapper and MenuBundleMapper are the single WRITE-side mappers introduced by the
# menu-bundles redesign (#156) — each dedups several near-identical inline copies. Their per-DTO
# construction blocks are INHERENTLY repetitive (mapping many similar-shaped DTOs) and structurally
# overlap both each other and the read-side query projections (e.g. GetProductByIdQuery), which map
# a RICHER / different field set and therefore can't be swapped onto these mappers without regressing
# reads. The genuinely-deduplicable duplication was already removed (ProductDtoMapper.ToLocalizedContent).
# This narrow exclusion covers only the residual by-design mapper repetition; revisit if the read-side
# projections are ever unified onto these mappers.
#
# CreateOrderFromBasketCommand (#157, slice 5) is the customer-checkout order command whose order-level
# field set is intentionally a SUBSET mirror of CreateOrderCommand's (the two order entry points share
# a contract). It can't be deduped via a shared base record without either (a) dragging the legacy
# command's value-type fields into new-code and regressing analysis on them, or (b) nesting the fields
# and breaking the flat JSON shape the frontend already posts. The item translation itself lives in the
# shared BasketToOrderTranslator; only the DTO field-declaration block is repeated here by design.
# EmailTemplates.*.cs WAS excluded here (GAP-2 S1) for the light/dark copies the two operator mails
# carried. That refactor is done (#356): the pair is one block rendered twice against EmailPalette,
# the 45 golden snapshots prove the rendered bytes did not move, and the exclusion is GONE — so
# genuine future duplication in a template is reported again, which is the whole reason not to leave
# a silence in place.
sonar.cpd.exclusions=**/ProductDtoMapper.cs, **/MenuBundleMapper.cs, **/CreateOrderFromBasketCommand.cs

# EF Core migrations are generated code — the CreateTable column list is inherently repetitive
# (each `character varying(n)` column is a near-identical line) and the *.Designer.cs / snapshot are
# full model dumps. A single column-heavy migration tips new_duplicated_lines_density over 3% and
# fails the PR gate. Exclude the whole Migrations folder from analysis (the CI coverage floor already
# excludes migrations on its axis; they are never hand-authored logic worth linting).
sonar.exclusions=**/Persistence/Migrations/**
