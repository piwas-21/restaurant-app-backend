# Dependabot — SECURITY updates only (workspace CLAUDE.md standing decision:
# "Dependabot PRs are paused").
#
# `open-pull-requests-limit: 0` is the documented way to switch OFF version-update
# PRs while leaving Dependabot SECURITY updates fully on — which is why the file
# stays here instead of being deleted. The CVE gates are unchanged (OSV-Scanner,
# Trivy, npm/nuget audit, SonarCloud all still run on every PR).
#
# Why: the decision not to merge these PRs was already taken, but the bot was still
# being paid to open them — 21 Dependabot/dependabot-branch workflow runs in the
# last 200 runs on this repo, plus 7 stale PRs open since 2026-07-13, all sitting
# unmerged and rebasing. This makes the status quo honest rather than changing it.
# Version drift is the accepted cost; re-enable by restoring the limits below.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 0  # version-update PRs off; security updates unaffected
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # .NET major version bumps (Microsoft.*/EF Core/Npgsql provider/Aspire)
      # are coordinated framework upgrades, not dependency PRs.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Aspire.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 0  # version-update PRs off; security updates unaffected
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
