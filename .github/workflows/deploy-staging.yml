name: deploy-staging

# Auto-deploys the BACKEND service to the STAGING box (Netcup, staging.fooderist.com)
# after `build-image` succeeds on `develop`. This is the staging counterpart of deploy.yml
# (which auto-deploys :latest to PROD on `main`); before it existed, a develop merge only
# built the :staging image and the box had to be rolled by hand.
#
#   - auto:   after `build-image` succeeds on develop (workflow_run) -> roll backend :staging
#   - manual: workflow_dispatch -> re-roll the current :staging (no rebuild)
#
# SCOPED to the `backend` service on purpose: the staging box co-locates the sofra site
# (its own :latest, behind a compose profile) + postgres/redis/caddy, and a RUMI deploy must
# not recreate any of them. `.env` on the box already pins BACKEND_TAG=staging, so pulling
# the moving :staging tag + recreating just that service is the whole deploy.
#
# app-secrets.json perms: NOT re-applied here (the full ./deploy.sh chowns it to the backend
# container gid). Routine develop builds keep the same gid, so the existing perms hold. A
# release that CHANGES the backend image uid/gid needs a one-time manual `./deploy.sh` on the
# staging box (see docs/runbooks/DEPLOYMENT.md); that is rare and self-evident (backend won't
# start). EF migrations, if any, run at backend startup as they do on every deploy.
#
# Requires repo secrets STAGING_DEPLOY_{HOST,USER,SSH_KEY,SSH_FINGERPRINT} (staging box +
# key, distinct from prod's DEPLOY_*).

on:
  workflow_run:
    workflows: ["build-image"]
    types: [completed]
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy backend (staging box)
    # Auto path only when the build actually succeeded; manual path always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH → roll backend :staging (scoped, never touches sofra)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.STAGING_DEPLOY_SSH_FINGERPRINT }}
          command_timeout: 18m
          # flock serialises against a concurrent frontend staging deploy (GitHub concurrency
          # groups don't span repos, and the frontend + demo-tenant rolls share this
          # lock). `-w 300` WAITS for it: with `-n` whichever deploy lost the race
          # exited 1 and the box silently kept the old image, reported as a red X
          # reading "skipping this run" (2026-07-25: RUMI staging missed a roll that
          # way). 5m fits inside command_timeout: 18m.
          # Scoped `pull backend` + `up -d backend` recreates only
          # the backend (its :staging digest moved); every other service keeps running.
          # The tenant refresh rides the SAME lock acquisition, not a second one: a
          # separate flock would re-queue behind the frontend/demo rolls and could
          # interleave a tenant pull with them. It refreshes every managed:scripts
          # tenant on this box pinned to backend_tag=staging (today: demo, which
          # otherwise only rolls when the FRONTEND builds — deploy #52). The `-x`
          # guard keeps this deploy green on a box that has not yet rsynced the
          # script; drop the guard once both boxes are past that release.
          script: |
            flock -w 300 /tmp/rumi-deploy.lock -c "cd /opt/rumi/deploy && docker compose -f docker-compose.prod.yml pull backend && docker compose -f docker-compose.prod.yml up -d backend && if [ -x ./refresh-tenant-images.sh ]; then ./refresh-tenant-images.sh backend staging; else echo 'note: refresh-tenant-images.sh not on this box yet — skipping tenant refresh'; fi && docker image prune -f" \
              || { echo "::error::timed out after 5m waiting for the RUMI deploy lock — this deploy did NOT run; re-run the job"; exit 1; }
