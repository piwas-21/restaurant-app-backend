name: CI

# Ported from .gitlab-ci.yml + 2026-05-05 hardening (DeelMarkt-borrowed:
# OSV-Scanner, TruffleHog alongside gitleaks, Trivy filesystem scan,
# SHA-pinned actions, concurrency cancellation, timeout caps).
#
# Out-of-scope: build_image / trivy image — those reintroduce when the
# new deploy strategy lands. Image-pushing does NOT happen here today.
#
# Security: this workflow uses no untrusted-input expressions
# (PR title/body/branch/commit) in run: commands. All inputs are
# either secrets.GITHUB_TOKEN or static literals. All third-party
# actions are pinned to immutable SHAs.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel stale runs when a new push lands on the same PR — saves
# free-tier Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet_format:
    name: dotnet format --verify-no-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: dotnet format RestaurantSystem.sln --verify-no-changes --no-restore --severity warn

  file_length:
    name: file-length (CLAUDE.md §4)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: bash scripts/check-file-length.sh --all

  dotnet_build_strict:
    name: dotnet build (warnings as errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Restore NuGet cache
        id: nuget_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet build RestaurantSystem.sln --nologo --verbosity minimal /p:TreatWarningsAsErrors=true
      # Only pushes to main/develop write the cache. A PR branch gets its
      # own cache scope that nothing else can read, so saving there would
      # cost ~38s of upload for a ~6s restore it never gets back; PRs read
      # develop's cache instead (restore-keys prefix).
      - name: Save NuGet cache
        if: github.event_name == 'push' && steps.nuget_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}

  # The DB-backed integration suite, SHARDED across runners.
  #
  # Shape: the suite already splits its DB-backed classes into four xUnit collections
  # ("lanes", see DatabaseCollections.cs), each with its own database, so they run in
  # parallel. On one 2-core runner that parallelism is capped at two lanes at a time —
  # measured (run 31990710971): 175s of test execution for a summed 142s of per-test
  # time, i.e. the runner, not the schedule, was the limit. This job therefore also
  # splits the WORK across two runners, each with its own postgres service container
  # (services are per-job, so cross-shard contamination is impossible by construction).
  #
  # The split is BY NAMESPACE and the two filters are exact complements: shard 2 is
  # `!~` of every key shard 1 matches. That is what guarantees no test is skipped and
  # none runs twice, even if a new test lands in a brand-new namespace — it simply
  # falls into shard 2. The aggregate job below re-verifies this against
  # `dotnet test --list-tests`, so a mistake here fails CI instead of silently
  # dropping tests. Groups are balanced on the per-namespace test time in the junit
  # report — which predicted the first sharded run within 10% (58s/84s predicted,
  # 62s/89s measured) — and are ~71s each of the 142s total after moving Basket to
  # shard 1. Rebalance by moving a namespace key between the two filters; the lanes
  # and the complement property are unaffected.
  #
  # NOT sharded further: the fixed floor per shard is ~132s (container init ~43s,
  # NuGet restore ~16s, checkout/setup ~4s, restore+compile ~62s) against only ~151s
  # of test work, so a third and fourth shard would each re-pay more than they remove.
  # Measured on this shape: 289s single job -> 234s (shards 194s + 221s, aggregate 9s).
  dotnet_test:
    name: dotnet test (integration) shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Both shards always run: a red shard must not hide the state of the other one.
      fail-fast: false
      matrix:
        include:
          - shard: 1
            filter: >-
              FullyQualifiedName~RestaurantSystem.IntegrationTests.Common.|FullyQualifiedName~RestaurantSystem.IntegrationTests.Features.Orders.|FullyQualifiedName~RestaurantSystem.IntegrationTests.Features.Products.|FullyQualifiedName~RestaurantSystem.IntegrationTests.Features.Payments.|FullyQualifiedName~RestaurantSystem.IntegrationTests.Features.Menus.|FullyQualifiedName~RestaurantSystem.IntegrationTests.Features.Basket.
          - shard: 2
            filter: >-
              FullyQualifiedName!~RestaurantSystem.IntegrationTests.Common.&FullyQualifiedName!~RestaurantSystem.IntegrationTests.Features.Orders.&FullyQualifiedName!~RestaurantSystem.IntegrationTests.Features.Products.&FullyQualifiedName!~RestaurantSystem.IntegrationTests.Features.Payments.&FullyQualifiedName!~RestaurantSystem.IntegrationTests.Features.Menus.&FullyQualifiedName!~RestaurantSystem.IntegrationTests.Features.Basket.
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restaurant_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INTEGRATION_TESTS_DB_CONNECTION: "Host=postgres;Port=5432;Database=restaurant_test;Username=test;Password=test"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Restore NuGet cache
        id: nuget_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      # This job compiles the solution itself (~62s) even though
      # `dotnet build (warnings as errors)` compiles the same graph in
      # parallel. Measured (run 31918097670): restore 6s, compile 46s,
      # tests 850s. Reusing the build job's output via `needs:` +
      # artifacts would DELAY the tests by ~57s (the test job would only
      # start after the 108s build job, then re-init its container),
      # i.e. it trades a 46s compile for a 108s wait — a net LOSS. Do not
      # "fix" this with `needs:`; the compile stays so the tests always
      # run against freshly built code from this checkout.
      #
      # Coverage is COLLECTED here but NOT gated here: a shard only exercises its own
      # slice of the code, so the floors are enforced on the merged report in the
      # aggregate job (scripts/merge-coverage.py). Do not re-add -p:Threshold here.
      - name: Run integration tests
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: |
          dotnet test RestaurantSystem.IntegrationTests/RestaurantSystem.IntegrationTests.csproj \
            --nologo --verbosity minimal \
            --filter "$TEST_FILTER" \
            --logger "junit;LogFileName=test-results.xml" \
            --results-directory test-results \
            -p:CollectCoverage=true \
            -p:CoverletOutputFormat=cobertura \
            -p:CoverletOutput="$GITHUB_WORKSPACE/test-results/coverage.cobertura.xml" \
            -p:Exclude='[*]*.Migrations.*'
      # The completeness guard's input: how many tests THIS shard's filter selects, plus
      # (shard 1 only) how many the suite has in total. Discovery is cheap — the assembly
      # is already built — and comparing the sum against the total is what proves the
      # filters still partition the suite. Counted at discovery, not execution: a [Theory]
      # whose rows are enumerated at run time counts as one test here and as N in the
      # junit report, so the two numbers are not comparable (1446 vs 1449 today).
      - name: Record this shard's discovered test count
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: |
          list_count() {
            dotnet test RestaurantSystem.IntegrationTests/RestaurantSystem.IntegrationTests.csproj \
              --no-build --nologo --list-tests "$@" | grep -cE '^ {4}\S'
          }
          list_count --filter "$TEST_FILTER" > test-results/discovered-shard-count.txt
          echo "shard ${{ matrix.shard }} discovered: $(cat test-results/discovered-shard-count.txt)"
          if [ "${{ matrix.shard }}" = "1" ]; then
            list_count > test-results/discovered-total-count.txt
            echo "suite total discovered: $(cat test-results/discovered-total-count.txt)"
          fi
      # Only pushes to main/develop write the cache. A PR branch gets its
      # own cache scope that nothing else can read, so saving there would
      # cost ~38s of upload for a ~6s restore it never gets back; PRs read
      # develop's cache instead (restore-keys prefix).
      - name: Save NuGet cache
        if: github.event_name == 'push' && steps.nuget_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/

  # Aggregate for the sharded suite. THIS job carries the required check name
  # "dotnet test (integration)" — the per-shard jobs are suffixed with their shard
  # number and are NOT individually required (verify with:
  # gh api repos/piwas-21/restaurant-app-backend/rulesets). Same shape as the
  # frontend repo's `screenshots_result` / `playwright_e2e_result` jobs.
  #
  # `if: always()` + an explicit equality test on the matrix result is what makes a
  # cancelled or skipped shard read as FAILURE rather than as green: `result` is
  # "success" only when every leg succeeded, and any other value exits 1.
  #
  # It also owns the two things a split run would otherwise lose:
  #   1. the coverage floors, enforced on the MERGED report (a single shard sees only
  #      part of the code, so per-shard floors would be meaningless);
  #   2. proof that the shards together ran every test exactly once.
  dotnet_test_result:
    name: dotnet test (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: dotnet_test
    steps:
      - name: Gate on shard results
        env:
          RESULT: ${{ needs.dotnet_test.result }}
        run: |
          echo "integration shard matrix result: $RESULT"
          [ "$RESULT" = "success" ] || { echo "::error::an integration-test shard did not pass"; exit 1; }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-results-shard-*
          path: shards
      - name: Verify the shards ran every test exactly once
        run: |
          total=$(cat shards/*/discovered-total-count.txt)
          selected=$(cat shards/*/discovered-shard-count.txt | awk '{ s += $1 } END { print s }')
          executed=$(grep -ho '<testcase ' shards/*/test-results.xml | wc -l | tr -d ' ')
          unique=$(grep -ho 'classname="[^"]*" name="[^"]*"' shards/*/test-results.xml | sort -u | wc -l | tr -d ' ')
          echo "discovered in suite=$total  selected by shards=$selected  executed=$executed  unique=$unique"
          [ "$selected" = "$total" ] || { echo "::error::the shard filters select $selected of $total tests — they no longer partition the suite"; exit 1; }
          [ "$unique" = "$executed" ] || { echo "::error::a test ran in more than one shard ($unique unique of $executed executed)"; exit 1; }
      # Floors unchanged from the single-job era (27% line / 18% branch / 32% method);
      # only the report they are applied to changed, from one shard's to the union.
      - name: Enforce coverage floors on the merged report
        run: |
          python3 scripts/merge-coverage.py \
            --line 27 --branch 18 --method 32 \
            shards/*/coverage.cobertura.xml

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xzf - -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --verbose --redact --source .

  trufflehog:
    name: TruffleHog (secret scan, complementary to gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on PRs — TruffleHog's diff-scan needs BASE != HEAD.
    # On a push to main/develop, BASE (default branch) == HEAD, which
    # the action errors on. Gitleaks already does the full-filesystem
    # secret scan on every push, so coverage doesn't regress.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@cb6aeefd6e2498240d0418e63f69684d28337e7b # v3.91.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  trivy_fs:
    name: Trivy filesystem (misconfig + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  license_compliance:
    name: license-compliance (transitive NuGet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mirrors trivy_fs / gitleaks: SHA-pinned checkout, capped timeout,
    # concurrency cancellation (inherited from top-level `concurrency`).
    #
    # Fails the build if any restored NuGet package (direct OR transitive)
    # carries a license outside the allowlist at repo-root
    # `LICENSES.allowlist`.
    #
    # To add a license: see the header in `LICENSES.allowlist`. Adding a
    # license is intentionally a code change so the diff is auditable.
    # Runs on the host runner with actions/setup-dotnet rather than the
    # mcr.microsoft.com/dotnet/sdk:10.0 container image — Microsoft's MCR
    # CDN intermittently WAF-blocks the docker pull ("The request is
    # blocked", Ref A/B/C error codes), turning this into a flaky check.
    # setup-dotnet pulls from a stable CDN endpoint without the same issue.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore NuGet cache
        id: nuget_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Install nuget-license (pinned)
        # actions/setup-dotnet adds ~/.dotnet/tools to PATH automatically,
        # so --global lands the binary somewhere subsequent steps can find.
        run: dotnet tool install --global nuget-license --version 4.0.0
      - name: Restore NuGet packages
        run: dotnet restore RestaurantSystem.sln --verbosity minimal
      # Only pushes to main/develop write the cache. A PR branch gets its
      # own cache scope that nothing else can read, so saving there would
      # cost ~38s of upload for a ~6s restore it never gets back; PRs read
      # develop's cache instead (restore-keys prefix).
      - name: Save NuGet cache
        if: github.event_name == 'push' && steps.nuget_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
      - name: Build allowlist (strip comments, emit JSON array)
        # nuget-license v4 expects the --allowed-license-types file as
        # a JSON array. The repo-tracked LICENSES.allowlist is kept in
        # the human-friendly one-per-line + `#` comments format; convert
        # to JSON here so the tracked file stays reviewable. Using awk
        # (always present) instead of jq (not in the .NET SDK image).
        run: |
          awk 'BEGIN{printf "["} /^[^#]/ && NF {printf "%s\"%s\"", sep, $0; sep=","} END{printf "]\n"}' \
            LICENSES.allowlist > /tmp/licenses-allowed.json
          echo "Allowed license types:"
          cat /tmp/licenses-allowed.json
      - name: Scan licenses
        # JsonPretty output makes the failure reviewable (Table format
        # embeds the full license body of any non-SPDX package and
        # blows the log out to >1MB on a single line).
        # --licenseurl-to-license-mappings maps non-SPDX license URLs
        # (older Microsoft.AspNetCore packages declare their license as
        # a raw GitHub URL rather than SPDX) to the actual SPDX type.
        # --override-package-information declares the SPDX license for a
        # specific package+version whose embedded license file the tool
        # can't classify. LICENSES.overrides.json is pure JSON (already
        # the shape nuget-license wants) so it's passed directly — its
        # per-entry `Comment` field carries the rationale + is version-
        # pinned so any bump forces a fresh license re-review. Currently:
        # SixLabors.ImageSharp (Six Labors Split License == Apache-2.0 at
        # our revenue tier; see the file + backend#213).
        run: |
          # Ignored packages: build-time-only Microsoft tooling that
          # ships its license as an embedded file the tool can't classify.
          # The repo-tracked LICENSES.ignored.txt is human-reviewable
          # (one package ID per line + `#` comments); nuget-license
          # expects a JSON array file (same shape as the allowlist), so
          # strip comments + convert to JSON here.
          awk 'BEGIN{printf "["} /^[^#]/ && NF {printf "%s\"%s\"", sep, $0; sep=","} END{printf "]\n"}' \
            LICENSES.ignored.txt > /tmp/ignored-packages.json
          echo "Ignored packages:"
          cat /tmp/ignored-packages.json
          echo "License overrides:"
          cat LICENSES.overrides.json
          nuget-license \
            -i RestaurantSystem.sln \
            -a /tmp/licenses-allowed.json \
            --licenseurl-to-license-mappings LICENSES.urlmap.json \
            --ignored-packages /tmp/ignored-packages.json \
            --override-package-information LICENSES.overrides.json \
            -o JsonPretty

  osv_scanner:
    name: OSV-Scanner (dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking initially — same pattern as frontend so the migration
    # PR can land. Tighten once the baseline NuGet dep tree is verified
    # clean against the OSV database.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: google/osv-scanner-action/osv-scanner-action@6fc714450122bda9d00e4ad5d639ad6a39eedb1f # v2.0.1
        with:
          scan-args: |-
            --recursive .
            --format=table
